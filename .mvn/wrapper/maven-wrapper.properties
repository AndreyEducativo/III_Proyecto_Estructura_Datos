# Configuración del Maven Wrapper (mvnw / mvnw.cmd).
# Gracias a este archivo NO hace falta instalar Maven: la primera vez que se ejecuta
# ./mvnw (Linux/macOS) o mvnw.cmd (Windows), se descarga esta versión exacta de Maven
# en la carpeta del usuario (~/.m2/wrapper) y se reutiliza en las siguientes ejecuciones.
# Lo único que debe estar instalado es un JDK 17 o superior.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
